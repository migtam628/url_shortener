# Local development stack. Hot reload everywhere, ports exposed on the host.
# Production overrides live in docker-compose.prod.yml.

name: mtlink

x-node-base: &node-base
  build:
    context: .
    dockerfile: services/api/Dockerfile
    target: dev
  env_file: [.env]
  working_dir: /app
  volumes:
    - .:/app
    - node_modules_root:/app/node_modules
    - geoip:/geoip
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-mtlink}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mtlink} -d $${POSTGRES_DB:-mtlink}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *node-base
    command: ["npm", "-w", "@mtlink/api", "run", "dev"]
    ports: ["${API_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *node-base
    command: ["npm", "-w", "@mtlink/api", "run", "dev:worker"]

  redirect:
    build:
      context: .
      dockerfile: services/redirect/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: [.env]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
    command: ["npm", "-w", "@mtlink/redirect", "run", "dev"]
    ports: ["${REDIRECT_PORT:-4001}:4001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: dev
    env_file: [.env]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
    command: ["npm", "-w", "@mtlink/dashboard", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: ["${DASHBOARD_PORT:-5173}:5173"]
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - acme_challenge:/var/www/acme
    depends_on: [api, redirect, dashboard]

volumes:
  pgdata:
  redisdata:
  geoip:
  acme_challenge:
  node_modules_root:
