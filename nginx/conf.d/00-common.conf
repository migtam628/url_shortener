# Shared snippets pulled in by the server blocks below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ACME HTTP-01 challenge root, shared by every short domain. The Phase 2
# cert issuer writes tokens here; see docs/ARCHITECTURE.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
