# Catch-all for every short domain. One server block serves all of them; the
# redirect service resolves the tenant from the Host header, so adding a
# customer domain needs a certificate but no nginx config change.
#
# Phase 2 (per-domain Let's Encrypt) swaps the static cert pair below for
# ssl_certificate directives driven by a map, or an ssl_certificate_by_lua
# hook. See docs/ARCHITECTURE.md.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dev-privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "unsafe-url" always;

    # A redirect response is tiny; don't let a slow upstream hold the socket.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    location / {
        proxy_pass         http://mtlink_redirect;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   CF-IPCountry      $http_cf_ipcountry;

        # Never let a proxy or CDN cache a redirect decision: the whole point
        # of this product is that destinations change.
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    location = /health {
        proxy_pass http://mtlink_redirect/health;
        access_log off;
    }
}
