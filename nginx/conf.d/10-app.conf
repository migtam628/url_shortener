# Dashboard + API. Served on app.<your-domain>.
#
# In dev this proxies to the Vite dev server. In prod the dashboard is built
# to static files and served straight off disk (see docker-compose.prod.yml,
# which mounts dashboard_dist at /var/www/dashboard) — swap the commented
# block in when you deploy.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name app.localhost app.mt.lc;

    ssl_certificate     /etc/nginx/certs/dev-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dev-privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass         http://mtlink_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Prometheus scrape target. Not exposed publicly — restrict to your
    # monitoring network or front it with METRICS_TOKEN.
    location /metrics {
        proxy_pass http://mtlink_api/metrics;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # --- dev: proxy to Vite ---
    location / {
        proxy_pass         http://mtlink_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # --- prod: serve the built SPA ---
    # location / {
    #     root /var/www/dashboard;
    #     try_files $uri $uri/ /index.html;
    #     location ~* \.(js|css|woff2?|svg|png|jpg|webp)$ {
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }
}
