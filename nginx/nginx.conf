user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect latency is the number that matters here, so log it.
    log_format  main  escape=json
        '{"ts":"$time_iso8601","ip":"$remote_addr","host":"$host",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent",'
        '"ref":"$http_referer","upstream":"$upstream_addr"}';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # ---- Real client IP -----------------------------------------------------
    # Cloudflare ranges. Refresh with: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Docker bridge, so the dev stack also resolves the right IP.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    # ---- Compression --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      application/wasm font/woff font/woff2;

    # brotli is only compiled into some nginx builds; load it if present.
    # (nginx:alpine does not ship it — see docs/DEPLOYMENT.md for the
    #  nginx-module-brotli variant if you want it.)

    # ---- TLS defaults -------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:20m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ---- Upstreams ----------------------------------------------------------
    # Docker's embedded DNS resolves the service name to every replica, so the
    # redirect upstream scales with `deploy.replicas` without config changes.
    upstream mtlink_redirect {
        server redirect:4001 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    upstream mtlink_api {
        server api:4000 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    upstream mtlink_dashboard {
        server dashboard:5173;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
